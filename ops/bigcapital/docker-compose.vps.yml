services:
  proxy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: bigcapital-proxy
    depends_on:
      server:
        condition: service_started
      webapp:
        condition: service_started
    ports:
      - "127.0.0.1:${BIGCAPITAL_PROXY_PORT:-3310}:80"
    restart: unless-stopped
    volumes:
      - ../../docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - bigcapital_network

  webapp:
    image: bigcapitalhq/webapp:latest
    container_name: bigcapital-webapp
    restart: unless-stopped
    networks:
      - bigcapital_network

  server:
    image: bigcapitalhq/server:latest
    container_name: bigcapital-server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      gotenberg:
        condition: service_started
    restart: unless-stopped
    environment:
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SECURE: ${MAIL_SECURE}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: ${DB_CHARSET}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      SYSTEM_DB_NAME: ${SYSTEM_DB_NAME}
      TENANT_DB_NAME_PERFIX: ${TENANT_DB_NAME_PERFIX}
      SYSTEM_DB_USER: ${SYSTEM_DB_USER}
      SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD}
      TENANT_DB_USER: ${TENANT_DB_USER}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_HOST: redis
      QUEUE_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL: ${BASE_URL}
      SIGNUP_DISABLED: ${SIGNUP_DISABLED}
      SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS}
      SIGNUP_ALLOWED_EMAILS: ${SIGNUP_ALLOWED_EMAILS}
      SIGNUP_EMAIL_CONFIRMATION: ${SIGNUP_EMAIL_CONFIRMATION}
      GOTENBERG_URL: http://gotenberg:3000
      GOTENBERG_DOCS_URL: http://server:3000/public/
      EXCHANGE_RATE_SERVICE: ${EXCHANGE_RATE_SERVICE}
      OPEN_EXCHANGE_RATE_APP_ID: ${OPEN_EXCHANGE_RATE_APP_ID}
      BANK_FEED_ENABLED: ${BANK_FEED_ENABLED}
      PLAID_ENV: ${PLAID_ENV}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_LINK_WEBHOOK: ${PLAID_LINK_WEBHOOK}
      HOSTED_ON_BIGCAPITAL_CLOUD: false
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      POSTHOG_HOST: ${POSTHOG_HOST}
      STRIPE_PAYMENT_SECRET_KEY: ${STRIPE_PAYMENT_SECRET_KEY}
      STRIPE_PAYMENT_PUBLISHABLE_KEY: ${STRIPE_PAYMENT_PUBLISHABLE_KEY}
      STRIPE_PAYMENT_CLIENT_ID: ${STRIPE_PAYMENT_CLIENT_ID}
      STRIPE_PAYMENT_WEBHOOKS_SECRET: ${STRIPE_PAYMENT_WEBHOOKS_SECRET}
      STRIPE_PAYMENT_REDIRECT_URL: ${STRIPE_PAYMENT_REDIRECT_URL}
    expose:
      - "3000"
    networks:
      - bigcapital_network

  migrate:
    image: bigcapitalhq/server:latest
    container_name: bigcapital-migrate
    profiles:
      - tools
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /app/packages/server
    command:
      - sh
      - -lc
      - node dist/cli.js system:migrate:latest && node dist/cli.js tenants:migrate:latest
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: ${DB_CHARSET}
      SYSTEM_DB_NAME: ${SYSTEM_DB_NAME}
      TENANT_DB_NAME_PERFIX: ${TENANT_DB_NAME_PERFIX}
      SYSTEM_DB_USER: ${SYSTEM_DB_USER}
      SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD}
      TENANT_DB_USER: ${TENANT_DB_USER}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD}
    networks:
      - bigcapital_network

  mysql:
    image: mariadb:11.4
    container_name: bigcapital-mysql
    command:
      - --character-set-server=${DB_CHARSET:-utf8}
      - --collation-server=utf8_general_ci
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${SYSTEM_DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - bigcapital_network

  redis:
    image: redis:7-alpine
    container_name: bigcapital-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    expose:
      - "6379"
    networks:
      - bigcapital_network

  gotenberg:
    image: gotenberg/gotenberg:7
    container_name: bigcapital-gotenberg
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - bigcapital_network

volumes:
  mysql:
    name: bigcapital_mysql
  redis:
    name: bigcapital_redis

networks:
  bigcapital_network:
    name: bigcapital_network
